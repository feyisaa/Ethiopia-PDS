<div class="d-flex justify-content-between align-items-center w-100">

    <!-- Left: User + Logout -->
    <form class="form-inline d-flex align-items-center"
          th:action="@{/logout}" method="post">

        <label class="text-light small ms-2 mb-0">
            [(#{current.user})]:
            <b>[[${#httpServletRequest.remoteUser}]]</b>

            <input class="btn btn-sm btn-link text-warning ms-2"
                   type="submit" value="Sign out"/>
        </label>
    </form>

    <!-- Right: Label + Language -->
    <div class="d-flex align-items-center">

        <label th:unless="${activated}"
               class="text-light small me-3 mb-0">
            [(${myf})]
        </label>

        <div class="lang-switch">
            <a class="text-light fw-bold"
               th:href="@{__${#httpServletRequest.requestURI}__(lang='en')}">En</a>
            |
            <a class="text-light fw-bold"
               th:href="@{__${#httpServletRequest.requestURI}__(lang='am')}">አማ</a>
			|   
			   <a class="text-light fw-bold"
			                 th:href="@{__${#httpServletRequest.requestURI}__(lang='ao')}">Ao</a>
        </div>

    </div>

</div>
