<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>All Cases</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- DataTables CSS -->
    <link rel="stylesheet"
          href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <link rel="stylesheet"
          href="https://cdn.datatables.net/buttons/2.4.1/css/buttons.dataTables.min.css">
	<link rel="stylesheet"
		  	      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"/>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>

    <!-- DataTables JS -->
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/dataTables.buttons.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.html5.min.js"></script>
	<style>
			body {
				background-color: rgb(57, 106, 147);
			}

			.btn-primary {
				background-color: rgb(50, 94, 129);
				border-color: rgb(50, 94, 129);
			}

			.btn-primary:hover {
				background-color: rgb(33, 63, 86) !important;
				border-color: rgb(33, 63, 86) !important;
			}
		</style>
</head>

<body>

<div class="container-fluid mt-3">
	<div th:insert="fragments/current-user"></div>
		
    <!-- Buttons -->
    <div class="mb-3">
        <a href="/" class="btn btn-warning me-2">Dashboard</a>
		<a th:href="@{/registry/full}" class="btn btn-success">
		    <i class="bi bi-file-earmark-arrow-down"></i>
		    Export FULL Dataset (CSV)
		</a>
    </div>

    <h4 class="mb-3">All Registered Cases</h4>

    <!-- Table wrapper -->
    <div class="table-responsive">
        <table id="casesTable"
               class="table table-bordered table-striped table-sm w-100">
            <thead class="table-light">
            <tr>
                <th>Case ID</th>
                <th>Case Date</th>
                <th>Death Type</th>
                
            </tr>
            </thead>

            <tbody>
            <tr th:each="c : ${cases}">
                <td th:text="${c.case_id}">CaseID</td>
                <td th:text="${#dates.format(c.case_date,'yyyy-MM-dd')}">Date</td>
                <td th:text="${c.case_death}">Death</td>
				
                
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
$(document).ready(function () {
    $('#casesTable').DataTable({
        dom: 'Bfrtip',
        buttons: ['excelHtml5', 'csvHtml5', 'print'],
        scrollX: true,          // ✅ FIX infinite width
        autoWidth: false,       // ✅ Prevent uncontrolled expansion
        pageLength: 10
    });
});
</script>

</body>
</html>
