lead_supervision_sg:Hojiin MPDSR: <ul>\
<li>Deetaa du'a haadhollee fi daa'immanii.</li>\
<li>Galmee walga'ii MPDSR.</li>\
<li>Gochoota fi yaada furmaataa MPDSR.</li>\
<li>Meeshaa, formii, SOPs, fi qajeelfama MPDSR.</li>\
<li>Namoota MPDSR hoogganan.</li>\
<li>Leenjii ogeessota fayyaa MPDSR irratti.</li>\
</ul>


