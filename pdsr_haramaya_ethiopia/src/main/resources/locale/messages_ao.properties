label.audit_delay1:Sadarkaa maatii irratti yaada furmaataa barbaaduuf turee?
notes.audit_delay1:Fkn: haati manatti dhiibbaa da'umsaa turuu dandeessi sababni isaa maatiin ishee dhukkuba kana ofii danda'uu sodaachuu, gatii yaalii irratti yaaddoo qabaachuu, ykn rakkoolee uumaman adda baasuu dadhabuu isaanii.
label.audit_delay2:Geejjibaa ykn daandii manca'e irraa kan ka'e yaalii argachuuf turtee turee?
notes.audit_delay2:Fkn: haati dhiibbaa da'umsaa qabdu geejjibaa ariifataa dhaabbata fayyaa gahuu dadhabuu dandeessi
label.audit_delay3:Yaalii sirrii argachuuf turtee turee?
notes.audit_delay3:Fkn: haati da'umsaa hospitala gahuu dandeessi garuu ogeessi fayyaa ishee gargaaru hin jiru, ykn dhaabbata sadarkaa gadi irraa gara dhaabbata sadarkaa ol aanaa geessuuf yeroo fudhatu dheerachuu danda'a
label.audit_delay3a:Dhaabbata fayyaa keessatti ogeessa fayyaatiin ilaalamuuf turtee turee (yeroo eeggannoo dheeraa)?

label.audit_delay3b:Yaalii sirrii kennuuf gara dhaabbata biroo erguuf turtee turee?
label.audit_delay3c:Yaalii murtaa'aa (fkn yeroo murtee kootaraa fi kootaraa godhame gidduutti yeroo dheeraa) kennuuf turtee turee?
label.audit_ifcmfs:Hawaasa/Maatii/Dhuunfaa keessatti rakkoolee jijjiiramuu danda'an
notes.audit_ifcmfs:Maatiin daa'ima duuteef yaalii daa'ima isaanii akkamitti akka barbaadan hin beekanii? Hawaasa keessatti maatiin duula barnootaa ykn qabeenya gargaaru argachuu qabanii?
label.audit_sysmfs:Sirna (Fayyaa ykn kaan) keessatti rakkoolee jijjiiramuu danda'an
notes.audit_sysmfs:Geejjibaan dhaabbata gadi irraa gara dhaabbata ol aanaa geejjiibuuf daangaa bulchiinsaan dhorgameeraa? Yaaliin dhaabbata biroo keessatti kennamu gaarii hin turree?
label.audit_facmfs:Dhaabbata fayyaa keessatti rakkoolee jijjiiramuu danda'an
notes.audit_facmfs:Dhaabbata duuti itti uumame keessatti; Meeshaaleen gargaaruuf jiru? Qorichoonni fi dhiyeessiin jiru? Iddoon yaalii jiru?
label.audit_hwkmfs:Ogeessa fayyaa keessatti rakkoolee jijjiiramuu danda'an
notes.audit_hwkmfs:Ogeessi fayyaa gargaarsa lubbuu baasuu gahuu danda'eeraa? Leenjii dabalataa barbaadaa? Akkaataa ogeessichi itti fayyadamu. Yaalii irratti yeroo dheerachuu.

