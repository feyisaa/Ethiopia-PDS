<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PDSR Tutorial Visual - Registry Workflow</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" />
</head>
<body class="bg-light p-4">
  <div class="container-fluid">
    <div class="d-flex justify-content-between mb-3">
      <h4>Registry Case List (Mock)</h4>
      <button class="btn btn-success btn-sm">Add Case</button>
    </div>
    <table class="table table-bordered table-sm bg-white">
      <thead class="table-dark">
        <tr>
          <th>Action</th>
          <th>Date Entered</th>
          <th>Mother Name</th>
          <th>Case Type</th>
          <th>Entry Status</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td><a href="#">Edit</a></td>
          <td>2026-02-17</td>
          <td>Jane N.</td>
          <td>Maternal death</td>
          <td>
            <span class="badge bg-success">Profile</span>
            <span class="badge bg-success">Referral</span>
            <span class="badge bg-warning text-dark">Pregnancy</span>
            <span class="badge bg-danger">Antenatal</span>
            <span class="badge bg-danger">Labour</span>
            <span class="text-muted ms-2">Incomplete</span>
          </td>
        </tr>
        <tr>
          <td><a href="#">Edit</a></td>
          <td>2026-02-18</td>
          <td>Ana K.</td>
          <td>Still birth</td>
          <td>
            <span class="badge bg-success">Profile</span>
            <span class="badge bg-success">Referral</span>
            <span class="badge bg-success">Pregnancy</span>
            <span class="badge bg-success">Antenatal</span>
            <span class="badge bg-success">Labour</span>
            <span class="text-primary fw-bold ms-2">Submitted!</span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
