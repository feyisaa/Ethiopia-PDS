<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PDSR Tutorial Visual - Survey Tool Form</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" />
</head>
<body class="p-4">
  <div class="card text-white" style="background: rgb(49,92,128)">
    <div class="card-header display-6">Survey Tool Form (Mock)</div>
    <div class="card-body">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Previous Survey Date</label>
          <input class="form-control" type="date" value="2025-08-01" />
        </div>
        <div class="col-md-6">
          <label class="form-label">Survey Date</label>
          <input class="form-control" type="date" value="2026-02-01" />
        </div>
      </div>

      <hr class="bg-light" />

      <div class="mb-3">
        <label class="form-label">1. MPDSR coordinator exists</label>
        <div>
          <label class="me-3"><input type="radio" checked /> Yes</label>
          <label><input type="radio" /> No</label>
        </div>
        <textarea class="form-control mt-2" rows="2" placeholder="Evidence / comments">Coordinator appointed by facility management.</textarea>
      </div>

      <div class="mb-3">
        <label class="form-label">2. External subnational supervision conducted</label>
        <div>
          <label class="me-3"><input type="radio" /> Yes</label>
          <label><input type="radio" checked /> No</label>
        </div>
        <textarea class="form-control mt-2" rows="2" placeholder="Evidence / comments">No district supervision visit during this interval.</textarea>
      </div>

      <div class="row g-3 mt-1">
        <div class="col-md-6">
          <label class="form-label">DHIS2 Maternal Death Count</label>
          <input class="form-control" type="number" value="11" />
        </div>
        <div class="col-md-6">
          <label class="form-label">DHIS2 Perinatal Death Count</label>
          <input class="form-control" type="number" value="36" />
        </div>
      </div>

      <div class="form-check mt-4">
        <input class="form-check-input" type="checkbox" />
        <label class="form-check-label">Review completed (reviewer validation)</label>
      </div>
    </div>
  </div>
  <div class="text-center mt-3">
    <button class="btn btn-primary">Save Changes</button>
  </div>
</body>
</html>
